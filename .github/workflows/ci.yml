name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  rigor-pipeline:
    name: Rigor Ecosystem (Logic, Visual, Performance)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Install Playwright OS Dependencies
        run: npx playwright install-deps chromium webkit

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx tsx scripts/generate-theme.ts
          npx prisma generate

      - name: Type Check & Lint
        run: |
          tsc --noEmit
          npm run lint

      - name: Build Production
        run: npx next build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Logic Tests (Vitest)
        id: vitest
        run: npm run test:ci

      - name: Run Visual & Drift Detection (Playwright)
        id: playwright
        run: npx playwright test
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Performance Benchmarks (Lighthouse)
        id: lighthouse
        run: npx lhci autorun
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Generate Centralized Health Dashboard
        if: always()
        run: |
          echo "# 🛡️ Rigor Ecosystem Health Report" >> $GITHUB_STEP_SUMMARY
          echo "### Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verification Layer | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mathematical Logic** (Vitest) | ${{ steps.vitest.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Masonry scheduling algorithms & text metrics |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visual & Drift Guard** (Playwright) | ${{ steps.playwright.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Sub-pixel pixel matching & layout constant sync |" >> $GITHUB_STEP_SUMMARY
          echo "| **Performance Gates** (Lighthouse) | ${{ steps.lighthouse.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Web Vitals & >95 Lighthouse score |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*(Generated via automated unified CI pipeline)*" >> $GITHUB_STEP_SUMMARY
