name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["dev", "main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rigor-pipeline:
    name: Rigor Ecosystem (Logic, Visual, Performance)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
            playwright-main-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers with Dependencies (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit --with-deps

      - name: Install Playwright Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx tsx scripts/generate-theme.ts
          npx prisma generate

      - name: Execute Pipeline Release Gate (Migrations & Integrity)
        run: npm run release:gate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci?schema=replay

      - name: Check Schema Drift
        run: |
          npm run check:migrations:drift
          npx prisma migrate status
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_ci?schema=replay

      - name: Check Documentation Drift
        run: npm run check-docs-drift

      - name: Lint Documentation
        run: npm run lint:docs

      - name: Type Check & Lint
        run: |
          npm run typecheck
          npm run lint

      - name: Next.js Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: nextjs-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            nextjs-${{ github.head_ref || github.ref_name }}-${{ hashFiles('package-lock.json') }}
            nextjs-main-${{ hashFiles('package-lock.json') }}

      - name: Build Production
        # Must be the same entrypoint Vercel runs. `npx next build` defaults to
        # Turbopack on Next 16, which never completes for this app (it was
        # cancelled at 41m47s here and never finished locally either).
        # scripts/build.js pins `next build --webpack`, which is what actually
        # ships, and it also runs the prisma/openapi/docs/standalone phases the
        # production build depends on.
        run: npm run build
        env:
          # Port 59999 has no listener, so @neondatabase/serverless fails fast and
          # static generation falls back. Pointing this at localhost:5432 reaches
          # the Postgres service container above: the Neon driver opens a
          # WebSocket handshake against a server that speaks the Postgres wire
          # protocol, gets no HTTP response, and waits forever with no timeout.
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"

      - name: Verify Bundle Performance Budgets
        id: bundle
        run: npm run analyze:bundle -- --strict

      - name: Run Logic Tests (Vitest)
        id: vitest
        run: npm run test:ci
        env:
          # Unit tests mock @/lib/db, but several suites bypass the mock and
          # import the real client whenever DATABASE_URL names something other
          # than a dummy host. The real client is @neondatabase/serverless over
          # a WebSocket, which cannot speak to the plain Postgres container
          # above, so pointing this at the service made 25 tests exercise a
          # database they can never reach. The container exists for the Prisma
          # CLI steps (migrate deploy / migrate diff), which use the native
          # migration engine and do connect.
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"

      - name: Run Shift-Left Property Fuzz Testing Gate
        id: mutation
        run: npm run test:mutation

      - name: Run Visual & Drift Detection (Playwright)
        id: playwright
        run: npx playwright test
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"
          CRON_SECRET: "ci_placeholder_cron_secret"

      - name: Run Real-Browser Sub-Route Web Vitals Performance Gate
        id: page-bench
        run: npm run bench:pages -- --assert
        env:
          DATABASE_URL: "postgresql://dummy:dummy@127.0.0.1:59999/dummy"
          CRON_SECRET: "ci_placeholder_cron_secret"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk"
          CLERK_SECRET_KEY: "sk_test_example_secret_key"

      - name: Verify ADR Invariants & Doctor Health Diagnostics
        run: npm run verify

      - name: Generate Centralized Health Dashboard
        if: always()
        run: |
          # Generate accessibility summary and status files
          node scripts/generate-accessibility-report.js || true

          # Read accessibility status
          ACC_STATUS="❌ Fail"
          if [ -f playwright-report/accessibility-status.txt ]; then
            ACC_STATUS=$(cat playwright-report/accessibility-status.txt)
          elif [ "${{ steps.playwright.outcome }}" = "success" ]; then
            ACC_STATUS="✅ Pass"
          fi

          echo "# 🛡️ Rigor Ecosystem Health Report" >> $GITHUB_STEP_SUMMARY
          echo "### Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Verification Layer | Status | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mathematical Logic** (Vitest) | ${{ steps.vitest.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Masonry scheduling algorithms & text metrics |" >> $GITHUB_STEP_SUMMARY
          echo "| **Shift-Left Property Fuzz Gate** | ${{ steps.mutation.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Fast-check generative invariants & property-based fuzz testing |" >> $GITHUB_STEP_SUMMARY
          echo "| **Visual & Drift Guard** (Playwright) | ${{ steps.playwright.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Sub-pixel pixel matching & layout constant sync |" >> $GITHUB_STEP_SUMMARY
          echo "| **Accessibility Audits** (Playwright-Axe) | $ACC_STATUS | Automated WCAG compliance scans on interactive states |" >> $GITHUB_STEP_SUMMARY
          echo "| **Sub-Route Real-Browser Performance Gate** | ${{ steps.page-bench.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Real-browser Core Web Vitals (LCP, CLS, TTFB) SLA assertions across sub-routes |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bundle Performance Budgets** | ${{ steps.bundle.outcome == 'success' && '✅ Pass' || '❌ Fail' }} | Initial bundle & chunk gzip performance limits |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*(Generated via automated unified CI pipeline)*" >> $GITHUB_STEP_SUMMARY

          if [ -f playwright-report/accessibility-summary.md ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat playwright-report/accessibility-summary.md >> $GITHUB_STEP_SUMMARY
          fi

  security-gate:
    name: Security Gate (Vulnerability Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security Audit Gate
        run: npm run audit:security
