name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Theme and Prisma Schema (Pre-build steps)
        run: |
          npx tsx scripts/generate-theme.ts
          npx prisma generate

      - name: Type Check
        run: tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run Logic Tests
        run: npm run test:ci
