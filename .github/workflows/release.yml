name: Deploy Production

# ADR 0049: merging to `main` deploys. This workflow runs once CI Pipeline
# has passed on a `main` push and ships exactly the commit CI verified. It
# never re-runs the CI gates (ADR 0039: no gating job twice per tree); it
# applies migrations, builds once, stages the artifact without touching the
# production domains, smoke-tests it, and only then promotes it (ADR 0038).
#
# Rollback is Vercel's Instant Rollback in the dashboard. Never use Redeploy
# to ship: it rebuilds the commit that is already live, not `main`.

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One production deploy at a time. A newer merge queues behind a running
# deploy instead of cancelling it mid-migration.
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "59.26.0"
  CANONICAL_ORIGIN: "https://deruiter.dev"

jobs:
  candidate:
    name: Pick the commit to deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.pick.outputs.deploy }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Confirm the candidate is the main tip and passed CI
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploys run from main only" >&2
            exit 1
          fi
          main_tip="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$CANDIDATE_SHA" != "$main_tip" ]]; then
            # A newer merge landed; its own CI run triggers its own deploy.
            echo "::notice::Skipping ${CANDIDATE_SHA}: main has moved on to ${main_tip}"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            conclusion="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${CANDIDATE_SHA}&event=push&status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "missing"')"
            if [[ "$conclusion" != "success" ]]; then
              echo "CI Pipeline has not passed on ${CANDIDATE_SHA} (${conclusion})" >&2
              exit 1
            fi
          fi
          echo "sha=${CANDIDATE_SHA}" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Migrate, stage, verify, and promote
    needs: candidate
    if: needs.candidate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-release
      url: ${{ steps.stage.outputs.url }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_release_replay
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portfolio_release_replay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout the commit CI verified
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - name: Check required secrets
        env:
          PRODUCTION_MIGRATION_DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for variable in PRODUCTION_MIGRATION_DATABASE_URL VERCEL_AUTOMATION_BYPASS_SECRET VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [[ -z "${!variable}" ]]; then
              echo "Required production-release secret ${variable} is missing" >&2
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Replay every migration on disposable PostgreSQL
        env:
          REPLAY_DB_HOST: localhost
          REPLAY_DB_NAME: portfolio_release_replay
          REPLAY_DB_PASSWORD: postgres
          REPLAY_DB_PORT: "5432"
          REPLAY_DB_SCHEMA: replay
          REPLAY_DB_USER: postgres
        run: |
          database_scheme="postgresql"
          export MIGRATION_REPLAY_URL="${database_scheme}://${REPLAY_DB_USER}:${REPLAY_DB_PASSWORD}@${REPLAY_DB_HOST}:${REPLAY_DB_PORT}/${REPLAY_DB_NAME}?schema=${REPLAY_DB_SCHEMA}"
          npm run migration:replay

      - name: Apply production migrations and verify zero drift
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_MIGRATION_DATABASE_URL }}
        run: |
          npm run check:migrations
          npx prisma migrate deploy
          npm run check:migrations:drift
          npx prisma migrate status

      - name: Build the production artifact once
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod

      - name: Stage the artifact without assigning production domains
        id: stage
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy \
            --prebuilt --prod --skip-domain --yes \
            --meta "gitCommitSha=${CANDIDATE_SHA}")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1)"
          if [[ ! "$deployment_url" =~ ^https:// ]]; then
            echo "Vercel did not return a deployment URL" >&2
            exit 1
          fi
          npx --yes "vercel@${VERCEL_CLI_VERSION}" inspect "$deployment_url" --wait --timeout=10m
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

      - name: Install Chromium for the smoke test
        run: npx playwright install chromium --with-deps

      # Staged *.vercel.app URLs sit behind Vercel Authentication; the bypass
      # secret lets the probes through without opening the deployment up.
      - name: Smoke-test the staged deployment
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.stage.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run probe:synthetic -- --project=chromium

      - name: Promote the verified deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$DEPLOYMENT_URL"
          --yes --timeout=10m

      - name: Verify the canonical domain serves the promoted deployment
        env:
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          api="https://api.vercel.com"
          auth="Authorization: Bearer ${VERCEL_TOKEN}"
          expected="$(curl --fail --silent --show-error --header "$auth" \
            "${api}/v13/deployments/${DEPLOYMENT_URL#https://}?teamId=${VERCEL_ORG_ID}" | jq -er '.id')"
          actual="$(curl --fail --silent --show-error --header "$auth" \
            "${api}/v4/aliases/${CANONICAL_ORIGIN#https://}?teamId=${VERCEL_ORG_ID}" | jq -er '.deploymentId')"
          if [[ "$expected" != "$actual" ]]; then
            echo "${CANONICAL_ORIGIN} points at ${actual}, expected ${expected}" >&2
            exit 1
          fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${CANONICAL_ORIGIN}/")"
          if [[ "$status" != "200" ]]; then
            echo "${CANONICAL_ORIGIN}/ returned ${status}" >&2
            exit 1
          fi
          location="$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' "https://www.${CANONICAL_ORIGIN#https://}/")"
          if [[ "$location" != "308 ${CANONICAL_ORIGIN}/" ]]; then
            echo "www did not 308 to the apex (got: ${location})" >&2
            exit 1
          fi

      - name: Summarize the deploy
        env:
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
        run: |
          printf '### Deployed to %s\n\n- Commit: `%s`\n- Deployment: %s\n- Roll back with Instant Rollback in the Vercel dashboard.\n' \
            "$CANONICAL_ORIGIN" "$CANDIDATE_SHA" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
