name: Non-Production Rollback Drill

on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: "Existing candidate deployment URL (*.vercel.app)"
        required: true
        type: string
      known_good_url:
        description: "Existing known-good deployment URL (*.vercel.app)"
        required: true
        type: string

concurrency:
  group: production-rollback-drill
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "59.16.0"

jobs:
  rollback-drill:
    name: Repoint an isolated alias to known-good
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-release
    steps:
      - name: Validate drill inputs
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          KNOWN_GOOD_URL: ${{ inputs.known_good_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ ! "$CANDIDATE_URL" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app/?$ ]]; then
            echo "candidate_url must be an HTTPS vercel.app deployment URL" >&2
            exit 1
          fi
          if [[ ! "$KNOWN_GOOD_URL" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app/?$ ]]; then
            echo "known_good_url must be an HTTPS vercel.app deployment URL" >&2
            exit 1
          fi
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "Required production-release secret VERCEL_TOKEN is missing" >&2
            exit 1
          fi

      - name: Point isolated drill alias at candidate
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx --yes "vercel@${VERCEL_CLI_VERSION}" alias set "$CANDIDATE_URL"
          "portfolio-rollback-drill-${GITHUB_RUN_ID}.vercel.app"
          --token="$VERCEL_TOKEN"

      - name: Verify candidate through isolated alias
        run: >-
          curl --fail --location --silent --show-error
          "https://portfolio-rollback-drill-${GITHUB_RUN_ID}.vercel.app/"
          --output /dev/null

      - name: Roll isolated alias back to known-good deployment
        env:
          KNOWN_GOOD_URL: ${{ inputs.known_good_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx --yes "vercel@${VERCEL_CLI_VERSION}" alias set "$KNOWN_GOOD_URL"
          "portfolio-rollback-drill-${GITHUB_RUN_ID}.vercel.app"
          --token="$VERCEL_TOKEN"

      - name: Verify known-good application after rollback
        run: >-
          curl --fail --location --silent --show-error
          "https://portfolio-rollback-drill-${GITHUB_RUN_ID}.vercel.app/"
          --output /dev/null

      - name: Record rollback drill evidence
        env:
          CANDIDATE_URL: ${{ inputs.candidate_url }}
          KNOWN_GOOD_URL: ${{ inputs.known_good_url }}
        run: |
          jq -n \
            --arg candidateUrl "$CANDIDATE_URL" \
            --arg knownGoodUrl "$KNOWN_GOOD_URL" \
            --arg alias "portfolio-rollback-drill-${GITHUB_RUN_ID}.vercel.app" \
            --arg completedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{candidateUrl: $candidateUrl, knownGoodUrl: $knownGoodUrl, alias: $alias, completedAt: $completedAt, databaseRecovery: "not exercised; database recovery is expand/contract roll-forward"}' \
            > rollback-drill-evidence.json

      - name: Upload rollback drill evidence
        uses: actions/upload-artifact@v4
        with:
          name: rollback-drill-${{ github.run_id }}
          path: rollback-drill-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Remove isolated drill alias
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx --yes "vercel@${VERCEL_CLI_VERSION}" alias remove
          "portfolio-rollback-drill-${GITHUB_RUN_ID}.vercel.app"
          --yes --token="$VERCEL_TOKEN"
