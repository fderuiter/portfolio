name: Auto-Sync & Rebase Dev on Main Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dev:
    name: Rebase Dev onto Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Verify Branches
        run: |
          echo "Fetching remote branches..."
          git fetch origin main:main || true
          git fetch origin dev:dev || true

      - name: Rebase Dev onto Main
        run: |
          echo "Switching to dev branch..."
          git checkout dev
          
          echo "Rebasing dev on top of main..."
          git rebase main

          echo "Pushing rebased dev branch to origin..."
          git push origin dev --force-with-lease

      - name: Output Workflow Step Summary
        if: success()
        run: |
          echo "# 🔄 Dev Branch Synchronization Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "The \`dev\` branch has been automatically rebased onto the latest \`main\` commit (\`${{ github.sha }}\`)." >> $GITHUB_STEP_SUMMARY
          echo "All active development branches should rebase onto \`dev\`." >> $GITHUB_STEP_SUMMARY

      - name: Handle Rebase Conflict or Failure
        if: failure()
        run: |
          echo "::error::Automatic rebase of 'dev' onto 'main' failed due to merge conflicts or permission constraints."
          echo "# ❌ Dev Branch Rebase Failed" >> $GITHUB_STEP_SUMMARY
          echo "Automatic rebase of \`dev\` onto \`main\` encountered conflicts. Manual intervention is required to rebase \`dev\` cleanly." >> $GITHUB_STEP_SUMMARY
