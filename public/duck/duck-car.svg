<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="creamCoatCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f5efe6" />
    </linearGradient>
    <linearGradient id="goldenEarCar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ee" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <radialGradient id="darkNoseCar" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="redHarness" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Car Window & Sky Background -->
  <rect width="500" height="500" fill="#1e293b" />
  <path d="M 0 0 L 500 0 L 500 350 L 0 350 Z" fill="#38bdf8" opacity="0.3" />
  <!-- Car Seat Leather -->
  <rect y="350" width="500" height="150" fill="#0f172a" />

  <g filter="url(#carShadow)">
    <!-- Fluffy Duck Sitting Upright in Co-Pilot Seat -->
    <!-- Body -->
    <ellipse cx="250" cy="350" rx="120" ry="120" fill="url(#creamCoatCar)" stroke="#fef08a" stroke-width="2" />

    <!-- Bright Red Adventure Harness -->
    <path d="M 160 310 C 190 340 310 340 340 310 L 350 350 C 310 380 190 380 150 350 Z" fill="url(#redHarness)" stroke="#991b1b" stroke-width="2" />
    <!-- Chest Harness Ring -->
    <circle cx="250" cy="345" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <path d="M 250 355 L 250 430" stroke="url(#redHarness)" stroke-width="16" stroke-linecap="round" />

    <!-- Front Paws -->
    <ellipse cx="195" cy="445" rx="20" ry="14" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />
    <ellipse cx="305" cy="445" rx="20" ry="14" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />

    <!-- Floppy Golden Retriever Ears -->
    <path d="M 165 140 C 120 150 90 220 115 290 C 130 315 155 315 170 290 C 185 260 185 200 175 145 Z" fill="url(#goldenEarCar)" stroke="#fde68a" stroke-width="2" />
    <path d="M 335 140 C 380 150 410 220 385 290 C 370 315 345 315 330 290 C 315 260 315 200 325 145 Z" fill="url(#goldenEarCar)" stroke="#fde68a" stroke-width="2" />

    <!-- Head Shape -->
    <path d="M 160 155 C 140 215 160 270 200 285 C 225 292 275 292 300 285 C 340 270 360 215 340 155 C 320 95 180 95 160 155 Z" fill="url(#creamCoatCar)" stroke="#fef08a" stroke-width="1.5" />

    <!-- Soft Muzzle Snout -->
    <ellipse cx="250" cy="235" rx="48" ry="36" fill="#ffffff" stroke="#fef08a" stroke-width="1" />

    <!-- Black Button Nose -->
    <path d="M 228 215 C 228 200 272 200 272 215 C 272 234 256 240 250 240 C 244 240 228 234 228 215 Z" fill="url(#darkNoseCar)" />
    <ellipse cx="242" cy="211" rx="5" ry="2.5" fill="#ffffff" opacity="0.6" />

    <!-- Contented Smile -->
    <path d="M 222 242 C 238 252 250 248 250 240 C 250 248 262 252 278 242" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bright Alert Travel Eyes -->
    <ellipse cx="205" cy="180" rx="13" ry="15" fill="url(#darkNoseCar)" />
    <circle cx="201" cy="175" r="5" fill="#ffffff" />
    <circle cx="210" cy="185" r="2" fill="#ffffff" />

    <ellipse cx="295" cy="180" rx="13" ry="15" fill="url(#darkNoseCar)" />
    <circle cx="291" cy="175" r="5" fill="#ffffff" />
    <circle cx="300" cy="185" r="2" fill="#ffffff" />
  </g>
</svg>
