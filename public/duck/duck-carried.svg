<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="creamCoatCarried" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f5efe6" />
    </linearGradient>
    <linearGradient id="goldenEarCarried" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ee" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <radialGradient id="darkNoseCarried" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="carriedShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Warm Home Vibe -->
  <rect width="500" height="500" fill="#1e1b18" />
  <circle cx="250" cy="250" r="230" fill="#292524" opacity="0.6" />

  <g filter="url(#carriedShadow)">
    <!-- Fred Holding Duck (Arms wrapped around fluffy body) -->
    <!-- Fred's Dark Grey Hoodie / Torso -->
    <path d="M 80 180 C 80 100 420 100 420 180 L 450 500 L 50 500 Z" fill="url(#hoodieGrad)" />

    <!-- Huge Fluffy Puppy Duck Body Held Upright -->
    <ellipse cx="250" cy="290" rx="120" ry="140" fill="url(#creamCoatCarried)" stroke="#fef08a" stroke-width="2" />

    <!-- Fred's Arms Wrapping Around Duck -->
    <!-- Left Arm -->
    <path d="M 60 260 C 90 320 160 380 230 380 C 240 380 240 340 210 340 C 160 340 110 300 90 250 Z" fill="#475569" stroke="#334155" stroke-width="2" />
    <!-- Right Arm -->
    <path d="M 440 260 C 410 320 340 380 270 380 C 260 380 260 340 290 340 C 340 340 390 300 410 250 Z" fill="#475569" stroke="#334155" stroke-width="2" />

    <!-- Giant Fluffy Bear Paws Draped Forward Over Arms -->
    <!-- Left Front Paw -->
    <path d="M 170 240 C 165 300 150 350 145 375 C 145 395 185 400 195 385 C 205 365 200 300 195 240 Z" fill="url(#creamCoatCarried)" stroke="#fef08a" stroke-width="1.5" />
    <ellipse cx="168" cy="385" rx="24" ry="16" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
    <!-- Paw Toes & Pads -->
    <circle cx="156" cy="385" r="4" fill="#78350f" />
    <circle cx="168" cy="390" r="4.5" fill="#78350f" />
    <circle cx="180" cy="385" r="4" fill="#78350f" />

    <!-- Right Front Paw -->
    <path d="M 330 240 C 335 300 350 350 355 375 C 355 395 315 400 305 385 C 295 365 300 300 305 240 Z" fill="url(#creamCoatCarried)" stroke="#fef08a" stroke-width="1.5" />
    <ellipse cx="332" cy="385" rx="24" ry="16" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
    <!-- Paw Toes & Pads -->
    <circle cx="320" cy="385" r="4" fill="#78350f" />
    <circle cx="332" cy="390" r="4.5" fill="#78350f" />
    <circle cx="344" cy="385" r="4" fill="#78350f" />

    <!-- Big Fluffy Golden Retriever Head Resting Contentedly -->
    <!-- Floppy Left Ear -->
    <path d="M 170 120 C 120 130 90 200 110 270 C 125 295 150 295 160 270 C 170 240 175 180 170 120 Z" fill="url(#goldenEarCarried)" stroke="#fde68a" stroke-width="2" />

    <!-- Floppy Right Ear -->
    <path d="M 330 120 C 380 130 410 200 390 270 C 375 295 350 295 340 270 C 330 240 325 180 330 120 Z" fill="url(#goldenEarCarried)" stroke="#fde68a" stroke-width="2" />

    <!-- Head Shape -->
    <path d="M 160 140 C 140 200 160 255 200 270 C 225 278 275 278 300 270 C 340 255 360 200 340 140 C 320 80 180 80 160 140 Z" fill="url(#creamCoatCarried)" stroke="#fef08a" stroke-width="1.5" />

    <!-- Soft Muzzle Snout -->
    <ellipse cx="250" cy="210" rx="46" ry="34" fill="#ffffff" stroke="#fef08a" stroke-width="1" />

    <!-- Big Button Nose -->
    <path d="M 230 190 C 230 175 270 175 270 190 C 270 208 255 214 250 214 C 245 214 230 208 230 190 Z" fill="url(#darkNoseCarried)" />
    <ellipse cx="243" cy="186" rx="5" ry="2.5" fill="#ffffff" opacity="0.6" />

    <!-- Gentle Mouth Curve -->
    <path d="M 228 218 C 240 226 250 222 250 216 C 250 222 260 226 272 218" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Sweet Contented Puppy Eyes -->
    <!-- Left Eye -->
    <ellipse cx="205" cy="155" rx="12" ry="14" fill="url(#darkNoseCarried)" />
    <circle cx="201" cy="150" r="4.5" fill="#ffffff" />
    <circle cx="210" cy="160" r="1.8" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="295" cy="155" rx="12" ry="14" fill="url(#darkNoseCarried)" />
    <circle cx="291" cy="150" r="4.5" fill="#ffffff" />
    <circle cx="300" cy="160" r="1.8" fill="#ffffff" />

    <!-- Blushing Cheeks -->
    <circle cx="180" cy="190" r="8" fill="#f472b6" opacity="0.4" />
    <circle cx="320" cy="190" r="8" fill="#f472b6" opacity="0.4" />
  </g>
</svg>
