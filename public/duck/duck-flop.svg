<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="creamCoatFlop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#faf8f5" />
      <stop offset="100%" stop-color="#f5efe6" />
    </linearGradient>
    <linearGradient id="goldenEarFlop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ee" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>
    <radialGradient id="darkNoseFlop" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="60%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <filter id="flopShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Lush Dog Park Grass Background -->
  <rect width="500" height="500" fill="#15803d" />
  <circle cx="250" cy="250" r="230" fill="#16a34a" opacity="0.4" />

  <!-- Grass Blades Accents -->
  <path d="M 40 420 L 45 390 M 45 420 L 55 385 M 120 440 L 125 410 M 380 430 L 390 395 M 440 410 L 450 380" stroke="#4ade80" stroke-width="2" stroke-linecap="round" />

  <g filter="url(#flopShadow)">
    <!-- Dog Friend Flop on Right Side (Golden Brown Retriever) -->
    <g transform="translate(340, 260) rotate(15)">
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="65" ry="45" fill="#d97706" />
      <!-- Paws in Air -->
      <ellipse cx="-25" cy="-35" rx="10" ry="16" fill="#b45309" />
      <ellipse cx="25" cy="-35" rx="10" ry="16" fill="#b45309" />
      <!-- Head -->
      <ellipse cx="0" cy="-45" rx="30" ry="25" fill="#d97706" />
      <circle cx="0" cy="-38" r="5" fill="#18181b" />
    </g>

    <!-- Duck Flopped on Back in Center Grass (Marshmallow White) -->
    <!-- Chubby White Belly with Soft Pink Tummy -->
    <ellipse cx="180" cy="270" rx="90" ry="60" fill="url(#creamCoatFlop)" stroke="#fef08a" stroke-width="2" />
    <ellipse cx="180" cy="275" rx="60" ry="38" fill="#fdf2f8" />

    <!-- 4 Fluffy White Paws Up in the Air with Brown Pads -->
    <!-- Front Left -->
    <g transform="translate(130, 210) rotate(-20)">
      <ellipse cx="0" cy="0" rx="14" ry="22" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
      <circle cx="0" cy="4" r="5" fill="#78350f" />
      <circle cx="-6" cy="-8" r="2.5" fill="#78350f" />
      <circle cx="0" cy="-11" r="2.5" fill="#78350f" />
      <circle cx="6" cy="-8" r="2.5" fill="#78350f" />
    </g>

    <!-- Front Right -->
    <g transform="translate(230, 210) rotate(20)">
      <ellipse cx="0" cy="0" rx="14" ry="22" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
      <circle cx="0" cy="4" r="5" fill="#78350f" />
      <circle cx="-6" cy="-8" r="2.5" fill="#78350f" />
      <circle cx="0" cy="-11" r="2.5" fill="#78350f" />
      <circle cx="6" cy="-8" r="2.5" fill="#78350f" />
    </g>

    <!-- Back Left -->
    <g transform="translate(110, 310) rotate(-10)">
      <ellipse cx="0" cy="0" rx="14" ry="20" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
      <circle cx="0" cy="4" r="5" fill="#78350f" />
    </g>

    <!-- Back Right -->
    <g transform="translate(250, 310) rotate(10)">
      <ellipse cx="0" cy="0" rx="14" ry="20" fill="#ffffff" stroke="#fef08a" stroke-width="2" />
      <circle cx="0" cy="4" r="5" fill="#78350f" />
    </g>

    <!-- Head Flopped on Grass -->
    <!-- Floppy Ears Splayed Wide -->
    <path d="M 120 180 C 80 180 50 240 70 290 C 85 310 110 300 120 280 C 130 250 130 200 120 180 Z" fill="url(#goldenEarFlop)" stroke="#fde68a" stroke-width="2" />
    <path d="M 240 180 C 280 180 310 240 290 290 C 275 310 250 300 240 280 C 230 250 230 200 240 180 Z" fill="url(#goldenEarFlop)" stroke="#fde68a" stroke-width="2" />

    <!-- Head Shape -->
    <ellipse cx="180" cy="190" rx="48" ry="38" fill="url(#creamCoatFlop)" stroke="#fef08a" stroke-width="2" />

    <!-- Happy Sleeping Closed Eyes -->
    <path d="M 155 180 C 160 190 170 190 175 180" fill="none" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 185 180 C 190 190 200 190 205 180" fill="none" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" />

    <!-- Big Soft Black Button Nose -->
    <circle cx="180" cy="165" r="7" fill="url(#darkNoseFlop)" />
    <circle cx="178" cy="163" r="2" fill="#ffffff" />

    <!-- Blushing Pink Cheeks -->
    <circle cx="145" cy="195" r="7" fill="#f472b6" opacity="0.5" />
    <circle cx="215" cy="195" r="7" fill="#f472b6" opacity="0.5" />

    <!-- Floating Hearts -->
    <text x="180" y="110" font-size="28" text-anchor="middle" fill="#ec4899">❤️</text>
    <text x="240" y="130" font-size="20" text-anchor="middle" fill="#f472b6">💖</text>
  </g>
</svg>
